name: BMS Ticket Checker

on:
  schedule:
    # GitHub cron is UTC. You're in IST (UTC+5:30), so 06:00-23:00 IST
    # == 00:30-17:30 UTC. Runs hourly, on the hour IST. Best-effort timing.
    - cron: "30 0-17 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Allow the job to push the updated state file back to the repo.
permissions:
  contents: write

# Don't let overlapping runs stomp on each other's state commit.
concurrency:
  group: bms-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync deps
        run: uv sync

      - name: Run checker
        env:
          BMS_URL: ${{ vars.BMS_URL }}
          BMS_DATES: ${{ vars.BMS_DATES }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE }}
          BMS_TIME: ${{ vars.BMS_TIME }}
          BMS_FORMAT: ${{ vars.BMS_FORMAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
        run: uv run main.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain bms_state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bms_state.json
            git commit -m "chore: update bms_state.json [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
